title: "Sesión 35 - Panel post FabCon"
speaker: "Ana, Diana, Nelson"
date: "Miércoles 7 de octubre de 2026"
time: "19:00"
description: 
  ¿Cuál fue el anuncio que más te gustó de la FabCon de Barcelona?

  Esa será la pregunta alrededor de la que girará nuestra próxima sesión de ADN Fabric.

  Ana, Diana y Nelson compartiremos nuestras respuestas, pero no estaremos solos: hemos preguntado lo mismo a varias figuras muy relevantes que estuvieron en la FabCon y tendremos sus respuestas grabadas.

  Además, contaremos con invitados que vivieron la FabCon en primera persona y queremos que sea una sesión muy abierta: los micrófonos estarán disponibles para cualquiera que quiera compartir su anuncio favorito, comentar o debatir.
