  ¡Seguimos a tope con la 4ª temporada de ADN Fabric!
  
  El próximo miércoles 21 de octubre, a las 19:00 (hora de España), tendremos nuestra sesión 37, en la que nos acompañará Nuric Ugarte, de NuData Bi.
  
  🎯 Desarrollar en Microsoft Fabric con IA: agentes y Skills de Fabric en acción
  
  En esta sesión veremos cómo aprovechar la inteligencia artificial para facilitar y acelerar el desarrollo de soluciones en Microsoft Fabric, utilizando agentes de IA y Fabric Skills.
  
  Una oportunidad para descubrir cómo estas herramientas están cambiando nuestra forma de trabajar con Fabric.
  
