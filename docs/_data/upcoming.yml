title: "Sesión 38 - Fabric Runtime 2.0 en la práctica: qué cambia en tus notebooks y Spark jobs"
speaker: "Eneko Egiguren Gómez"
date: "Miércoles 4 de noviembre de 2026"
time: "19:00"
description: |
  Fabric Runtime 2.0 trae una nueva versión de Spark y cambios importantes en el motor de ejecución. 
  
  En esta sesión repasaremos qué novedades incorpora, cómo afecta a nuestros notebooks y Spark jobs (y a los pipelines que los orquestan), y qué conviene tener en cuenta para migrar con garantías. 
    
  Veremos ejemplos prácticos y buenas prácticas para sacarle partido desde el primer día.
  
