description: |
  🏆 ¡Seguimos a tope en ADN Fabric!

  Y para no perder el impulso de la FabCon de Barcelona, ¡volvemos con otra sesión la próxima semana! 😊

  En la sesión 36 nos acompañará Ricardo Rincón, Microsoft MVP, para hacer algo diferente: una Tier List con las novedades más importantes anunciadas en la FabCon.

  ¿Qué anuncios merecen estar en el nivel S? ¿Cuáles nos parecen menos relevantes?

  Iremos clasificando las novedades, compartiendo nuestras opiniones y debatiendo sobre su impacto en Microsoft Fabric.

  Y, por supuesto, ¡queremos conocer también vuestra opinión!
